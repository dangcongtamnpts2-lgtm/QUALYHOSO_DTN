<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>Quản lý đăng ký công tác & thanh toán</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--sf:#fff;--tx:#1b2430;--mu:#5d6b7c;--ac:#1456b8;--bd:#d3dae4;--dn:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12171e;--sf:#1b222c;--tx:#e6ebf2;--mu:#98a5b6;--ac:#6ea4ff;--bd:#334052;--dn:#ff7a6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12171e;--sf:#1b222c;--tx:#e6ebf2;--mu:#98a5b6;--ac:#6ea4ff;--bd:#334052;--dn:#ff7a6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Arial,sans-serif}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd)}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
h1{font-size:17px;margin:0}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:60px}input[type=checkbox]{width:auto}input[type=range]{padding:0}
button{padding:7px 12px;border:1px solid var(--ac);background:var(--ac);color:var(--bg);border-radius:6px;cursor:pointer;font:inherit}
button.s{background:transparent;color:var(--ac)}button.d{background:transparent;color:var(--dn);border-color:var(--dn)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:transparent;color:var(--tx);border-color:var(--bd)}.tabs button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--bd);padding:4px;text-align:left;vertical-align:top}th{font-size:13px;background:var(--bg)}td input{border:0;background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.mu{color:var(--mu);font-size:13px}.err{color:var(--dn)}
.sec{display:none}.sec.on{display:block}.ro button:not([onclick^="xp"]){display:none}

async function upPdf(fs){const st=$('#pdfst');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';for(const f of fs){try{st.textContent='Đang đọc '+f.name+'...';const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();t+=c.items.map(x=>x.str).join(' ')+' '}t=t.replace(/\s+/g,' ');const g=re=>{const m=t.match(re);return m?m[1]:''},num=s=>s.replace(/[^\d]/g,'');D.inv.push({ks:g(/Ký hiệu[^:]{0,30}:\s*([A-Z0-9]{4,10})/i),so:g(/Số\s*(?:\([^)]*\))?\s*:\s*(\d{1,10})/i).replace(/^0+(?=\d)/,''),lo:g(/(HÓA ĐƠN [A-ZÀ-Ỹ ]{3,40}?)(?= Ký hiệu| \(| Mẫu| Số| Ngày|$)/),nb:g(/Mã số thuế[^:]{0,30}:\s*(\d[\d-]{8,13})/i),th:num(g(/(?:Cộng )?tiền thuế[^\d]{0,60}([\d.,]+)/i)),tg:num(g(/Tổng (?:cộng )?tiền thanh toán[^\d]{0,80}([\d.,]+)/i))});st.textContent='Đã đọc '+f.name+'. Hãy kiểm tra lại số liệu trong bảng.'}catch(e){st.textContent='Không đọc được '+f.name+' ('+(e.message||e)+'). Hãy nhập tay.'}}save();lists();calc()}
const sh=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ct:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');

function sqUI(){return `<div class="card"><h2>Sổ quản lý quyết định nhóm công tác</h2><p class="mu">Quyết định của mọi hồ sơ tự động được lưu vào sổ khi có số quyết định. Tìm theo số, nội dung, nhóm trưởng, mã hồ sơ, ngày.</p><div class="row"><input id="sqs" placeholder="Tìm kiếm..." value="${esc(SQ)}" oninput="SQ=this.value;sqT()" style="max-width:320px"><button class="s" onclick="refHS()">Làm mới</button><button onclick="xp('sq')">⬇ Xuất sổ (Excel)</button></div><div id="sqt"></div></div>`}
function sqT(){const e=$('#sqt');if(!e)return;const r=sqRows();e.innerHTML='<div class="t"><table><tr><th>Số TT</th><th>Số QĐ</th><th>Ngày QĐ</th><th>Nội dung</th><th>Nhóm trưởng</th><th>Thời gian</th><th>Hồ sơ</th></tr>'+r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.so)}</td><td>${fdm(x.ng)}</td><td>${esc(x.nd)}</td><td>${esc(x.truong)}</td><td>${esc(x.tg)}</td><td><button class="s" onclick="openHS('${x.ma}')">${x.ma}</button></td></tr>`).join('')+'</table></div>'+(r.length?'':'<p class="mu">Chưa có quyết định phù hợp.</p>')}
async function dlHS(ma){await openHS(ma);await xp('all')}
async function dlAll(){const ks=Object.keys(S.hs);if(!ks.length)return toast('Chưa có hồ sơ nào');const z=new JSZip(),keep=CUR;toast('Đang tạo file cho '+ks.length+' hồ sơ...');try{for(const ma of ks){setCur(ma);const f=z.folder(ma);for(const [n,fn] of [['Giay_dang_ky_cong_tac.docx',()=>DX(dkBody())],['Quyet_dinh_nhom_cong_tac.docx',()=>DX(qdBody())],['Giay_uy_quyen.docx',()=>DX(uqBody())],['Giay_de_nghi_thanh_toan.docx',()=>DX(gdBody())],['Bang_tinh_cong_tac_phi.xlsx',ttX],['Bang_ke_hoa_don.xlsx',bkX]])f.file(n,await fn())}await saveFile({filename:'Tat_ca_ho_so.zip',data:await z.generateAsync({type:'blob'})})}catch(e){toast('Lỗi tải hồ sơ: '+(e.message||e))}if(keep)setCur(keep);else{CUR=H=D=null}}
async function bkUp(){await saveFile({filename:'Sao_luu_'+new Date().toISOString().slice(0,10)+'.json',data:new Blob([JSON.stringify({v:1,t:new Date().toISOString(),users:S.users,hs:S.hs})],{type:'application/json'})})}
async function bkIn(f){if(!f)return;try{const o=JSON.parse(await f.text());if(!o.hs||!o.users)throw new Error('File không đúng định dạng');o.users.forEach(u=>{if(!S.users.find(x=>x.u===u.u))S.users.push(u)});Object.assign(S.hs,o.hs);save();if(DB){await flush();for(const k of Object.keys(o.hs))await DB.doc('hs/'+k).set(cl(o.hs[k]))}toast('Đã khôi phục '+Object.keys(o.hs).length+' hồ sơ');draw()}catch(e){toast('Lỗi khôi phục: '+(e.message||e))}}

function goNav(k){const free=['hs','sq','kho'];if(k=='kho')KHO.length||khoLoad();if(k=='zip'){if(!CUR)return toast('Hãy mở một hồ sơ trước khi tải ZIP');return xp('all')}
if(!free.includes(k)){if(!CUR){toast('Hãy tạo hoặc mở một hồ sơ trước');tab='hs';return draw()}if(role()=='pay'&&!PAYT.includes(k))return toast('Vai trò của bạn không có mục này trong hồ sơ này')}

function homeUI(){const free=['hs','sq','kho'],n=HM.length,wg='conic-gradient('+HM.map((x,i)=>x[2]+' '+(i*360/n)+'deg '+((i+1)*360/n)+'deg').join(',')+')';
const it=HM.map((x,i)=>{const off=!free.includes(x[0])&&(!CUR||(role()=='pay'&&!PAYT.includes(x[0])&&x[0]!='zip')),side=i%2?'R':'L';return `<div class="it ${side}" style="grid-column:${i%2?3:1};grid-row:${Math.floor(i/2)+1}"><button class="pill ${off?'off':''}" style="background:${x[2]};color:${x[3]}" title="${off?(CUR?'Vai trò của bạn không có mục này':'Cần mở một hồ sơ trước'):''}" onclick="goNav('${x[0]}')"><span class="tx">${x[1]}</span><b class="nb" style="color:${x[2]=='#bcd42a'||x[2]=='#f2a51a'?'#3a2800':x[2]}">${i+1}</b></button><i class="dt"></i></div>`}).join('');

function fillTT(){D.tt.length=0;D.dk.team.forEach(p=>D.tt.push({n:p.n,di:D.dk.sd,ve:D.dk.ed}));save();lists();calc()}
function addU(){const n=$('#nu').value.trim();if(n){D.dk.units.push({n,c:1});save();units()}}
function units(){$('#units').innerHTML=D.dk.units.map((u,i)=>`<div class="row"><label style="margin:0;color:inherit"><input type="checkbox" ${u.c?'checked':''} onchange="D.dk.units[${i}].c=this.checked?1:0;save()"> ${esc(u.n)}</label><span class="noprint"><button class="s" onclick="eu(${i})">Sửa</button><button class="d" onclick="D.dk.units.splice(${i},1);save();units()">Xóa</button></span></div>`).join('')}

el.value=o[n]??'';const up=()=>{o[n]=el.value;if(o===D.uq&&n=='ten')uqPick(o[n]);save();calc()};el.oninput=up;el.onchange=up});units();tys();oldL();sdDraw();pickFill()}
function listEd(id,arr,cols,numbered){const el=$('#L_'+id);
el.innerHTML=`<div class="t"><table><tr>${numbered?'<th>STT</th>':''}${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th class="noprint"></th></tr>${arr.map((r,i)=>`<tr>${numbered?`<td>${i+1}</td>`:''}${cols.map(c=>c[3]?`<td data-c="${c[0]}${i}"></td>`:`<td><input ${c[2]||''} value="${esc(r[c[0]])}" oninput="LL['${id}'][${i}]['${c[0]}']=this.value;save();calc()"></td>`).join('')}<td class="noprint"><button class="d" onclick="LL['${id}'].splice(${i},1);save();lists();calc()">✕</button></td></tr>`).join('')}</table></div><button class="s noprint" onclick="LL['${id}'].push({});save();lists();calc()">+ Thêm dòng</button>`}

listEd('team',D.dk.team,[['n','Họ và tên'],['b','Bậc AT'],['r','Chức danh']],1);

function calc(){if(!D)return;$('#cnt').value=D.dk.team.length;$('#dm').style.display=D.dk.types.some(x=>x.c&&x.n!='Thông thường')?'':'none';if($('#bm'))$('#bm').value=BM;if($('#qdnd'))$('#qdnd').textContent=qdNd();D.uq.ds.forEach(r=>{if(r.n&&r.cccd)D.cccd[r.n]=r.cccd});const sl=$('#invsel');if(sl){const v=sl.value;sl.innerHTML=D.inv.map((r,i)=>`<option value="${i}">${i+1}. ${esc(r.ks)} ${esc(r.so)}</option>`).join('');sl.value=v}
for(const k of['s','e']){$('#'+k+'hv').textContent=(D.dk[k+'h']||0)+'h';$('#'+k+'mv').textContent=D.dk[k+'m']||0}
$('#ttdm').value=D.dk.dm||'';$('#tthm').value=D.dk.hm||'';let tot=0,ex=D.ttx;D.tt.forEach((r,i)=>{const n=r.di&&r.ve?Math.max(0,Math.round((new Date(r.ve)-new Date(r.di))/864e5)+1):0,dm=Math.max(0,n-1),pc=n*(+ex.ln||0)*(dm?1:.5),ph=dm*(+ex.ph||0),t=pc+ph;tot+=t;[['sn',n],['sd',dm],['pc',pc],['ph',ph],['t',t]].forEach(([k,v])=>{const c=document.querySelector(`[data-c="${k}${i}"]`);if(c)c.textContent=(k=='sn'||k=='sd')?v:money(v)})});tot+=['taxi','xk','mb','db'].reduce((a,k)=>a+(+ex[k]||0),0);
